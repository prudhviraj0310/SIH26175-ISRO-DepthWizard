services:
  - type: web
    name: isro-depthwizard-3d
    env: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.depth_wizard.server:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      - key: UFORIA_PORT
        value: 8000
    healthCheckPath: /api/health
    autoDeploy: true
